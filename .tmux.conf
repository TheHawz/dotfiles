# ── Prefix Key ──────────────────────────
# Default prefix: Ctrl+b (no change needed)

# ── General Settings ─────────────────────
set -g mouse on
set-window-option -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g default-terminal "${TERM}"

# ── Status Bar ────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-left " #S "
set -g status-right " %H:%M %d-%b "

# ── Terminal Colors ──────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on


# unbind C-b

# images in nvim (snacks.image) and `kitten icat`: forward the kitty graphics protocol to kitty/Ghostty
set -gq allow-passthrough on
set -g visual-activity off
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
# lets nvim reload files edited by agents in other panes (autoread)
set -g focus-events on


# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# ── TPM Plugin Manager ───────────────────
# Install TPM first: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Keep the run line at the very bottom of this file.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'



# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# floating panes
# Alt-f toggles a persistent floating terminal (backed by a hidden "<session>-float" session).
# run-shell (not if -F): formats inside if-branches don't expand in the popup's context.
bind -n M-f run-shell -b 'case "#{session_name}" in *-float) tmux detach-client -t "#{client_name}" ;; *) tmux display-popup -c "#{client_name}" -E -w 85% -h 80% -d "#{pane_current_path}" "TMUX= tmux new -A -s \"#{session_name}-float\"" ;; esac'
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit



# @workmux_status is set by workmux's Claude hooks (status_format: false in ~/.config/workmux/config.yaml)
# theme: tmux 3.8 theme colours (themeblack, themewhite, themedarkgrey, ...), used by every style below
# and by tmux's own menus and copy-mode. Values: Kanso Ink, from Ghostty's theme file.
# To change theme, replace these values (light-theme-* is the set used when the terminal reports a light background).
set -s dark-theme-black '#14171d'
set -s dark-theme-white '#c5c9c7'
set -s dark-theme-dark-grey '#22262d'
set -s dark-theme-light-grey '#a4a7a4'
set -s dark-theme-red '#c4746e'
set -s dark-theme-green '#8a9a7b'
set -s dark-theme-yellow '#c4b28a'
set -s dark-theme-blue '#8ba4b0'
set -s dark-theme-magenta '#a292a3'
set -s dark-theme-cyan '#8ea4a2'

set -g status-style 'bg=themeblack,fg=themewhite'
set -g status-left-length 40
set -g status-left '#[fg=themeblack,bg=themeblue,bold] #S #[fg=themeblue,bg=themeblack,nobold]'
set -g window-status-format '#[fg=themeblack,bg=themedarkgrey]#[fg=themelightgrey] #I  #W#{?@workmux_status, #{@workmux_status},} #F #[fg=themedarkgrey,bg=themeblack]'
set -g window-status-current-format '#[fg=themeblack,bg=themecyan]#[fg=themeblack] #I  #W#{?@workmux_status, #{@workmux_status},} #F #[fg=themecyan,bg=themeblack]'
set -g window-status-separator ''
set -g message-style 'bg=themedarkgrey,fg=themewhite'
set -g message-command-style 'bg=themedarkgrey,fg=themecyan'
set -g mode-style 'bg=themedarkgrey,fg=themeyellow'
setw -g clock-mode-colour 'themecyan'

# zellij-ish frames: rounded popups, titled panes, highlighted active border
# (tmux can't round pane corners or add gaps between panes)
set -g popup-border-lines rounded
set -g popup-border-style 'fg=themecyan'
set -g popup-style 'bg=themeblack,fg=themewhite'
set -g pane-border-lines heavy
set -g pane-border-style 'fg=themelightgrey'
set -g pane-active-border-style 'fg=themecyan'
set -g pane-border-status top
set -g pane-border-format ' #{pane_index} #{pane_current_command} '

# sesh: pick/create sessions from tmux sessions and zoxide dirs (ctrl-s cycles sources, ctrl-x kills)
bind -N "sesh: pick or create a session" K display-popup -h 90% -w 50% -E "sesh picker -i"
bind -N "sesh: last session" L run-shell "sesh last"

# workmux: agent dashboard, sidebar, and jumping between agents
bind A display-popup -E -w 90% -h 90% "workmux dashboard"
bind S run-shell "workmux sidebar"
bind a run-shell "workmux last-done"
bind Tab run-shell "workmux last-agent"

# which-key lite: while prefix is active, the right side of the bar shows key hints
set -g status-right-length 800
set -g status-right '#{?client_prefix,#[fg=themeblack#,bg=themeyellow#,bold] c#[nobold]:new  #[bold]n/p#[nobold]:next/prev  #[bold]#,#[nobold]:rename  #[bold]"#[nobold]:split↓  #[bold]%%%%#[nobold]:split→  #[bold]z#[nobold]:zoom  #[bold]g#[nobold]:lazygit  #[bold]M-f#[nobold]:float  #[bold]x#[nobold]:kill  #[bold]K#[nobold]:sesh  #[bold]L#[nobold]:last-sess  #[bold]s#[nobold]:sessions  #[bold]w#[nobold]:tree  #[bold]$#[nobold]:rename-sess  #[bold]d#[nobold]:detach  #[bold][#[nobold]:copy  #[bold]A#[nobold]:dashboard  #[bold]S#[nobold]:sidebar  #[bold]a#[nobold]:next-done  #[bold]Tab#[nobold]:last-agent  #[bold]?#[nobold]:all ,#[fg=themelightgrey#,bg=themedarkgrey] %Y-%m-%d  %H:%M }'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
