# Replaces Ghostty (~/.config/ghostty/config.ghostty).
# Reload with Ctrl+Shift+F5, or Cmd+, then reload from the menu.

include kanso-ink.conf

# Pin the italic cuts. Without this, kitty renders bold-italic as plain italic.
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        13.0

# Ghostty cursor-style = bar, cursor-style-blink = false
cursor_shape          beam
cursor_blink_interval 0

# Ghostty window-padding-x/y = 8, macos-titlebar-style = hidden
window_padding_width        8
hide_window_decorations     titlebar-only
macos_show_window_title_in  menubar
macos_titlebar_color        background

# Ghostty macos-option-as-alt = left
# Left Option is Alt (tmux M-f, zellij Alt+hjkl). Right Option keeps macOS unicode input.
macos_option_as_alt left

# Ghostty copy-on-select = clipboard
copy_on_select clipboard

# Ghostty mouse-hide-while-typing = true
# Negative hides the pointer as soon as you type. macOS may ignore this.
mouse_hide_wait -1

# Ghostty shell-integration = zsh. Kitty's integration is on by default;
# it sets the prompt cursor, cwd reporting, and window title.
shell_integration enabled

# Quit with the last window, same as Ghostty / Terminal.app.
macos_quit_when_last_window_closed yes

scrollback_lines 10000
enable_audio_bell    no
