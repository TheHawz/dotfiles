background {
    monitor =
    path = $HOME/.local/share/wallpapers/1-memento-mori.jpg
    blur_passes = 3
    blur_size = 6
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.30
    dots_spacing = 0.30
    outer_color = #8ba4b0
    inner_color = #14171d
    font_color = #c5c9c7
    fail_color = #c4746e
    check_color = #c4b28a
    placeholder_text = <span foreground="#8a8d8b">Contraseña…</span>
    fade_on_empty = false
    rounding = 8
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = #e8eae9
    font_size = 88
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = #d4d7d5
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}
