# foot — terminal por defecto.
# Los colores los genera apply-theme.sh desde templates/foot.ini.tpl.

[main]
include=~/.config/mytheme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=12
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Shift+Return como CSI-u, para que las TUIs lo distingan de Return.
\x1b[13;2u=Shift+Return
# Alt+Shift+Return como CSI-u, para que tmux pueda casar M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
